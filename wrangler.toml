# Unified Cloudflare Worker — serves both:
#   1. The public flip-deal product (one car at a time, Stripe deposit per
#      listing) — main Worker script under flipper-club/src/. This is the public
#      entry point at https://carsbuyer.org/ (also reachable at the
#      original olx-car-parser.permikov134.workers.dev).
#   2. The internal stlite analytics dashboard at /analytics/* — gated by HTTP
#      Basic Auth (ANALYTICS_USER / ANALYTICS_PASS secrets), served from the
#      ./dashboard-static asset bundle via the ASSETS binding. Not a product —
#      the internal tool for inspecting the model, market, and decision context.
#
# CI flow (configured in the Cloudflare dashboard, not here):
#   1. CF Pages clones master.
#   2. Runs the build command: ``python3 scripts/build_stlite_bundle.py``
#      which materialises ``dashboard-static/files/*.py`` and downloads the
#      latest data witnesses.
#   3. Runs ``npx wrangler deploy`` which reads THIS file, finds the
#      [assets] directory, registers the KV binding, and deploys the Worker.
#
# Secrets (set once per environment, NEVER committed — `wrangler secret put X`):
#   STRIPE_SECRET_KEY      sk_live_… / sk_test_…  — required for the deposit flow
#   STRIPE_WEBHOOK_SECRET  whsec_…                — required to verify webhooks
#   ANALYTICS_USER         Basic-Auth user for /analytics + raw data assets
#   ANALYTICS_PASS         Basic-Auth password    (both unset ⇒ analytics denied)

name = "olx-car-parser"
main = "flipper-club/src/index.js"
compatibility_date = "2024-12-01"
account_id = "6545f93bd664df2dfebb147bda85a191"

# Public domain. Registered through Cloudflare Registrar, so the zone is
# already in this account and `custom_domain = true` lets the deploy create
# both the Custom Domain and its DNS record — no dashboard step.
#
# The workers.dev hostname stays live on purpose: the Stripe webhook is
# registered against it, and pSEO pages have been indexed there since July.
# It no longer serves content though: CANONICAL_HOST below redirects it to the
# apex. The webhook is unaffected: the redirect guard sits after the
# /webhook/stripe branch, so Stripe's signed POST still reaches this origin
# intact and the endpoint does NOT need repointing in the Stripe dashboard.
#
# www is bound so that typing it resolves at all; it is not the canonical host,
# so the same guard 301s it to the apex. No duplicate content: exactly one
# hostname ever serves a 200.
routes = [
  { pattern = "carsbuyer.org", custom_domain = true },
  { pattern = "www.carsbuyer.org", custom_domain = true },
]
# MUST stay true while routes are configured. Wrangler turns the workers.dev
# subdomain OFF as soon as a route exists unless this is set, and that hostname
# is not disposable: the Stripe webhook is registered against it and ~243 pSEO
# URLs are indexed on it. Dropping it took the whole product down for the
# minutes between the deploy and the apex resolving.
workers_dev = true

# Assets are served via env.ASSETS.fetch() — the Worker chooses which paths
# get to them (Basic-Auth-gated /analytics dashboard + /files /data assets)
# vs. which are the public product routes (/, /reserve, /unlocked).
[assets]
binding = "ASSETS"
directory = "./dashboard-static"
# Streamlit's filename-based multipage nav generates URLs like
# /analytics/Market_Direction that don't exist as static files; SPA mode
# routes every miss back to index.html so stlite takes over client-side.
not_found_handling = "single-page-application"
# Run the Worker BEFORE checking static assets. Default CF behavior is the
# opposite — static files win and the Worker only runs on 404. That makes
# / serve dashboard-static/index.html directly, bypassing our routing and the
# analytics Basic-Auth gate. With this flag, every request hits our Worker,
# which then chooses when to delegate to env.ASSETS.fetch().
run_worker_first = true

# Single KV namespace. Holds the deals cache ("cache:deals:{zone}") and the
# per-visitor unlock records ("unlock:{uid}:{olx_id}") written after a paid
# deposit. (The old "pin:" / "session:" PIN apparatus is gone.) Run once:
# ``npx wrangler kv namespace create KV`` and paste the returned id below.
[[kv_namespaces]]
binding = "KV"
id = "5ae27bd650e94beeb2de2adf5ac2108c"

[vars]
# Deposit charged to reserve one car + unlock its seller contact. Amount is in
# the currency's smallest unit (cents): 500 = €5.00. Override per environment.
DEPOSIT_AMOUNT_CENTS = "500"
CURRENCY = "eur"

# GA4. Пусто = аналитика выключена целиком, ни одного запроса наружу, что и
# нужно в dev. Сниппет объявляет Consent Mode v2 с запретом хранилища по
# умолчанию: аудитория в ЕЭЗ, поэтому до согласия GA4 шлёт обезличенные пинги
# без кук. Сам ID публичный, он и так виден в исходнике страницы.
GA4_MEASUREMENT_ID = "G-2RSXJHJJYP"

# GA4_API_SECRET хранится в СЕКРЕТАХ воркера, не здесь: с ним можно писать
# события в ресурс от чужого имени. Без него серверное событие purchase из
# вебхука Stripe просто не отправляется, всё остальное работает.

# Canonical public hostname. When set, every request to any OTHER hostname
# (i.e. the workers.dev subdomain) is permanently redirected here, so the two
# hostnames stop splitting ranking signals. /healthz and /webhook/stripe are
# never redirected — see the guard in flipper-club/src/index.js.
#
# Verified live before enabling: .org delegation published, Custom Domain
# bound, and the edge serving 200 under a valid CN=carsbuyer.org certificate.
CANONICAL_HOST = "carsbuyer.org"

# Who stands behind the numbers, shown on /sobre and /metodologia and emitted as
# schema.org author/founder + Organization email.
#
# Deliberately empty by default. For a money topic, naming a person and a
# reachable address is a real trust signal — but an invented address is a
# promise the site cannot keep, and that is worse than staying anonymous. Fill
# these in and both pages grow the block; leave them and both render the
# brand-level version with no author and no mailto.
SITE_AUTHOR = "Nikita Permiakov"
SITE_CONTACT_EMAIL = "permikov134@yandex.ru"

# Staged rollout of the per-model second SEO layer (model-year, depreciation and
# facet pages). Caps it to the N deepest-sampled models; empty = no cap.
#
# 718 model-year pages arriving on one crawl is a bad way to learn whether the
# layer works: 40% indexation could be an unconvincing template or a crawl-budget
# wall, and there is no way to tell them apart afterwards. Release a few hundred
# URLs at a time, check indexation and positions in Search Console for that wave,
# then widen. Wave size is not free to pick: the gate counts models, not URLs, and
# the deepest-sampled models carry the most pages, so 10 models to 25 is already
# 280 new URLs. Measured against the 2026-08-30 blob, N maps to gated URLs like
# this (year + depreciation + facet pages):
#
#   SEO_WAVE_MODELS = "10"   ->  289    "25"  ->  572    "60"  ->  938
#                     "20"   ->  494    "30"  ->  647    ""    -> 1450
#
# The curve is steep at the start because the deepest-sampled models are also the
# ones with the most publishable years — 10 models already carry 188 of the 718
# year pages. "10" was the right first wave.
#
# The gate is read by the router, the sitemap AND the year links on the model
# page, so a page outside the wave is unreachable and unlinked — never a link to
# a 404. Widening is only this number: no code deploy, no data rebuild.
SEO_WAVE_MODELS = "25"

# Cron. Records the weekly market cut for /mercado/indice.
#
# Daily, not weekly, and the handler writes only when the current ISO week has
# no row yet. Weekly would mean one shot per week: a failed Monday run, or a
# broken data build that morning, would cost the whole week — and a missing week
# is never recovered, because the numbers for a week that has passed no longer
# exist. Six retries cost a KV read each.
#
# 00:05 UTC: just after midnight, so a new ISO week is recorded the moment it
# starts rather than whenever a visitor happens to arrive.
[triggers]
crons = ["5 0 * * *"]

[observability]
enabled = true
