name: Tests

on:
  push:
    branches: [master]
  # PRs run the same suite before merge. Without this, a PR's only checks are
  # GitGuardian and the Workers build, so a red suite is discovered only after
  # the merge push — which is how the typer 0.27 breakage reached master.
  pull_request:
    branches: [master]
  workflow_dispatch:

# A PR gets one run per head commit; pushing a fixup cancels the run still
# grinding through the previous one instead of queueing behind it.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit + integration tests
        # Skip the smoke marker — those tests hit live third-party
        # endpoints (the OLX API, the LLM providers) and would turn an
        # upstream hiccup into a red PR. Run them from the scrape host
        # with `pytest -m smoke` when a transport or provider changes.
        run: pytest tests/ -v --tb=short -m "not smoke"

      - name: Worker smoke
        # The Python suite cannot see flipper-club/src. `node --check` only
        # parses — it happily accepts a const used above its declaration, which
        # then throws at request time in production. Actually rendering a page
        # is what catches that; it caught exactly this bug on 2026-08-26.
        # No npm install: these modules import nothing outside themselves.
        run: |
          for f in flipper-club/src/*.js; do node --check "$f"; done
          node --input-type=module -e "
            import { renderModelPage, renderModelsHub } from './flipper-club/src/templates.js';
            const rec = { b:'Volkswagen', m:'Golf', n:42, fm:7200, fl:4800, fh:9500,
                          gm:7100, gl:4400, gh:9800, y0:2010, y1:2019, kmm:180000,
                          sd:28, sn:134, fu:[['Diesel',0.95]], yrs:[] };
            const html = renderModelPage({ rec, slug:'volkswagen-golf', liveDeals:[],
                                           siblings:[], host:'carsbuyer.org',
                                           depositCount:0, builtAt:'2026-01-01T00:00:00Z' });
            if (!html.includes('FAQPage')) throw new Error('model page lost its FAQ schema');
            if (!html.includes('canonical')) throw new Error('model page lost its canonical');
            const hub = renderModelsHub({ models:[{slug:'volkswagen-golf',b:'Volkswagen',m:'Golf',fm:7200,n:42}],
                                          depositCount:0, builtAt:'2026-01-01T00:00:00Z',
                                          host:'carsbuyer.org' });
            if (!hub.includes('volkswagen-golf')) throw new Error('hub lost its links');

            // Аналитика: без Measurement ID наружу не должно уходить ничего,
            // а с ним Consent Mode обязан объявляться ДО загрузчика gtag -
            // иначе первый запрос уйдёт с разрешённым хранилищем, и в ЕЭЗ это
            // куки без согласия.
            const { setAnalyticsId } = await import('./flipper-club/src/templates.js');
            setAnalyticsId('');
            if (renderModelPage({ rec, slug:'volkswagen-golf', liveDeals:[], siblings:[],
                                  host:'carsbuyer.org', depositCount:0,
                                  builtAt:'2026-01-01T00:00:00Z' }).includes('gtag'))
              throw new Error('analytics leaked with no measurement id');
            setAnalyticsId('G-TESTONLY');
            const tagged = renderModelPage({ rec, slug:'volkswagen-golf', liveDeals:[], siblings:[],
                                             host:'carsbuyer.org', depositCount:0,
                                             builtAt:'2026-01-01T00:00:00Z' });
            if (!tagged.includes('G-TESTONLY')) throw new Error('analytics tag missing');
            if (!tagged.includes(\"analytics_storage:'denied'\"))
              throw new Error('consent mode default is not denied');
            if (tagged.indexOf(\"consent','default'\") > tagged.indexOf('googletagmanager'))
              throw new Error('consent declared after the gtag loader');
            setAnalyticsId('');

            console.log('worker templates render OK');
          "
