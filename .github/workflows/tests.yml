name: Tests

on:
  push:
    branches: [master]
  # PRs run the same suite before merge. Without this, a PR's only checks are
  # GitGuardian and the Workers build, so a red suite is discovered only after
  # the merge push — which is how the typer 0.27 breakage reached master.
  pull_request:
    branches: [master]
  workflow_dispatch:

# A PR gets one run per head commit; pushing a fixup cancels the run still
# grinding through the previous one instead of queueing behind it. Pushes to
# master get a group PER COMMIT instead of sharing one: the group holds a single
# pending run, so a shared group let each push evict the previous commit's
# queued run and master went a whole day with no tested head.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-full:
    runs-on: ubuntu-latest

    # Tests run against a real PostgreSQL because production does. On SQLite
    # they passed while production broke: it enforces neither foreign keys
    # nor a bound-parameter ceiling, and both cost us a scrape on 2026-08-28.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/olx_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit + integration tests
        # Skip the smoke marker — those tests hit live third-party
        # endpoints (the OLX API, the LLM providers) and would turn an
        # upstream hiccup into a red PR. Run them from the scrape host
        # with `pytest -m smoke` when a transport or provider changes.
        run: pytest tests/ -v --tb=short -m "not smoke"

      - name: Worker smoke
        # Runs even when pytest failed: the two suites cover different code, and
        # a red Python test used to cancel this step and hide whether the worker
        # was broken too. Only a cancelled run skips it.
        if: ${{ !cancelled() }}
        # The Python suite cannot see flipper-club/src. `node --check` only
        # parses — it happily accepts a const used above its declaration, which
        # then throws at request time in production. Actually rendering a page
        # is what catches that; it caught exactly this bug on 2026-08-26.
        # No npm install: these modules import nothing outside themselves.
        run: |
          for f in flipper-club/src/*.js; do node --check "$f"; done
          # node --check пропускает то, что валит настоящий деплой: двойная
          # запятая в списке импорта прошла проверку и упала уже в CF-сборке на
          # esbuild. Собираем тем же парсером, которым собирает wrangler.
          npx --yes esbuild flipper-club/src/index.js --bundle --format=esm --outfile=/dev/null
          node --input-type=module -e "
            import { renderModelPage, renderModelsHub } from './flipper-club/src/templates.js';
            const rec = { b:'Volkswagen', m:'Golf', n:42, fm:7200, fl:4800, fh:9500,
                          gm:7100, gl:4400, gh:9800, y0:2010, y1:2019, kmm:180000,
                          sd:28, sn:134, fu:[['Diesel',0.95]], yrs:[] };
            const html = renderModelPage({ rec, slug:'volkswagen-golf', liveDeals:[],
                                           siblings:[], host:'carsbuyer.org',
                                           depositCount:0, builtAt:'2026-01-01T00:00:00Z' });
            if (!html.includes('FAQPage')) throw new Error('model page lost its FAQ schema');
            if (!html.includes('canonical')) throw new Error('model page lost its canonical');
            const hub = renderModelsHub({ models:[{slug:'volkswagen-golf',b:'Volkswagen',m:'Golf',fm:7200,n:42}],
                                          depositCount:0, builtAt:'2026-01-01T00:00:00Z',
                                          host:'carsbuyer.org' });
            if (!hub.includes('volkswagen-golf')) throw new Error('hub lost its links');

            // Аналитика: без Measurement ID наружу не должно уходить ничего,
            // а с ним Consent Mode обязан объявляться ДО загрузчика gtag -
            // иначе первый запрос уйдёт с разрешённым хранилищем, и в ЕЭЗ это
            // куки без согласия.
            const { setAnalyticsId } = await import('./flipper-club/src/templates.js');
            setAnalyticsId('');
            if (renderModelPage({ rec, slug:'volkswagen-golf', liveDeals:[], siblings:[],
                                  host:'carsbuyer.org', depositCount:0,
                                  builtAt:'2026-01-01T00:00:00Z' }).includes('gtag'))
              throw new Error('analytics leaked with no measurement id');
            setAnalyticsId('G-TESTONLY');
            const tagged = renderModelPage({ rec, slug:'volkswagen-golf', liveDeals:[], siblings:[],
                                             host:'carsbuyer.org', depositCount:0,
                                             builtAt:'2026-01-01T00:00:00Z' });
            if (!tagged.includes('G-TESTONLY')) throw new Error('analytics tag missing');
            if (!tagged.includes(\"analytics_storage:'denied'\"))
              throw new Error('consent mode default is not denied');
            if (tagged.indexOf(\"consent','default'\") > tagged.indexOf('googletagmanager'))
              throw new Error('consent declared after the gtag loader');

            // Оценка показывается двумя путями, и у записи модели нет поля
            // названия, которое есть у объявления. Параметр модели уходил
            // пустым ровно на частом пути, а событие при этом было на месте.
            const { renderAvaliar, renderClaimSuccess } = await import('./flipper-club/src/templates.js');
            const mrec = { b:'Audi', m:'A3', n:40, fm:15000, fl:12000, fh:19000,
                           y0:2012, y1:2020, kmm:150000, fu:[['Diesel',0.9]],
                           yr:[{y:2017,m:16000,l:14000,h:18000,n:12}] };
            const av = renderAvaliar({ rec:null, olxId:null, sourceUrl:null, query:'',
                                       models:{'audi-a3':mrec}, host:'carsbuyer.org',
                                       spec:{ rec:mrec, slug:'audi-a3', year:2017, cell:mrec.yr[0] },
                                       depositCount:0, builtAt:'2026-01-01T00:00:00Z' });
            if (!av.includes('valuation_result')) throw new Error('valuation_result lost on the model path');
            if (!av.includes('\"model\":\"Audi A3\"')) throw new Error('valuation_result model param is empty');

            // Идентификатор покупки приходит из обработчика: он один и тот же у
            // страницы и у вебхука, иначе одна оплата легла бы в GA4 дважды.
            const suc = renderClaimSuccess({ deal:{olx_id:'123', url:'https://olx.pt/x', make:'Audi'},
                                             zone:'all', depositEur:20, claimedAtMs:1700000000000,
                                             depositCount:1, txnId:'123-cs_test_abc' });
            if (!suc.includes('123-cs_test_abc')) throw new Error('claim success ignores the passed transaction id');

            setAnalyticsId('');

            // Первый тест самого обработчика, а не шаблонов. Признаки настройки
            // нужны потому, что опечатку в имени секрета в панели Cloudflare
            // иначе не отличить от рабочей настройки до первой оплаты.
            const worker = (await import('./flipper-club/src/index.js')).default;
            const env = { GA4_MEASUREMENT_ID: 'G-TESTONLY', GA4_API_SECRET: 'x', STRIPE_SECRET_KEY: 'sk_test_x' };
            const verbose = await worker.fetch(new Request('https://carsbuyer.org/healthz?verbose=1'), env);
            if (verbose.headers.get('cache-control') !== 'no-store')
              throw new Error('health verbose must not be cacheable');
            const flags = await verbose.json();
            if (!(flags.ga4_tag && flags.ga4_mp_secret && flags.stripe))
              throw new Error('health verbose lost a configuration flag');
            const off = await (await worker.fetch(new Request('https://carsbuyer.org/healthz?verbose=1'), {})).json();
            if (off.ga4_mp_secret || off.stripe)
              throw new Error('health verbose reports configuration that is absent');
            const bare = await worker.fetch(new Request('https://carsbuyer.org/healthz'), env);
            if ((await bare.text()) !== 'ok')
              throw new Error('bare healthz body changed - external monitors match on it');

            console.log('worker templates render OK');
          "
          # Клиентский purchase и серверный через Measurement Protocol обязаны
          # склеивать transaction_id из одной величины - id сессии Stripe.
          # Разъедутся формулы, и согласившийся покупатель даст двойную выручку.
          grep -q 'session.id}`' flipper-club/src/index.js
          grep -q 'rec.stripe_session_id' flipper-club/src/index.js
          # Полный прогон страниц и роутера: node --check и esbuild ловят только
          # то, что не парсится, а харнессы рендерят каждую публичную страницу и
          # гоняют роутер через worker.fetch() - коды ответов, canonical, robots,
          # разбираемый JSON-LD, совпадение sitemap с роутером, порт ISV против
          # isv.py и то, что аналитика молчит без Measurement ID.
          # Идут по коммиченному фикстуру, поэтому сбой релиза latest-data не
          # красит ветку. Вручную по живому блобу - без аргумента.
          node tests/worker/render_smoke.mjs tests/worker/fixtures/models.json
          node tests/worker/route_smoke.mjs  tests/worker/fixtures/models.json
