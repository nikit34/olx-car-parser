# OLX.pt Car Parser Settings

scraper:
  base_url: "https://www.olx.pt/carros-motos-e-barcos/carros/"
  interval_hours: 6
  request_delay_min: 0.7
  request_delay_max: 1.5
  # 200 covers OLX's full active inventory with margin (typical depth ≈
  # 150 pages). The actual loop terminates earlier via the known-ids
  # early-stop in scrape_all when the deep pages become mostly revisits —
  # ~30 pages on a steady-state DB.
  max_pages: 200
  private_only: true
  # Detail-page fetch concurrency. 16 is a conservative bump from 12 — the
  # log showed only 2 EAGAIN events per 4h, so headroom exists. Higher
  # values (20+) start hitting OLX's per-IP soft rate limit and trigger
  # the 403 backoff in scraper.py:140. Bumping further only pays off
  # paired with a residential-proxy rotation, which we don't have.
  concurrency: 16

database:
  path: "data/olx_cars.db"

analytics:
  trend_window_days: 30
  buy_signal_threshold: 10

llm:
  # Local Ollama with qwen3:4b-instruct. /api/chat with format=json constrains
  # the model to emit parseable JSON; the system prompt documents the
  # 15-field schema, so no separate tool wrapper is required.
  ollama_model: "qwen3:4b-instruct"
  # Production inference pool — both hosts handle traffic in parallel
  # via sticky-per-thread round-robin in _pick_ollama_url(). The dev Mac
  # is intentionally NOT in this list; it orchestrates but never inferences.
  #   localhost      — runner's own Ollama (was 192.168.1.77; switched to
  #                    localhost because the runner's DHCP-assigned IP was
  #                    drifting and self-references via the LAN IP started
  #                    failing with EHOSTUNREACH whenever the route
  #                    table didn't include the new IP).
  #   192.168.1.69   — Windows partner, 16 GB (7B+ headroom). Must run
  #                    Ollama with OLLAMA_HOST=0.0.0.0 + Windows Firewall
  #                    rule on TCP 11434 inbound.
  ollama_urls:
    - "http://localhost:11434"
    - "http://192.168.1.69:11434"
  # Legacy single-URL field kept for back-compat; ignored if ollama_urls is set.
  ollama_url: "http://localhost:11434"
  # Server slots: .77 NUM_PARALLEL=2 (3 OOMs Metal at 4096 ctx on M1 Air 8GB
  # → Ollama silently caps ctx to 1536, head of system prompt gets truncated).
  # .69 must stay at NUM_PARALLEL=1 — its MX230 has only 4 GB VRAM, and
  # NUM_PARALLEL=2 forces KvSize=8192 which trips "failure during GPU
  # discovery" (CUDA discovery timeout) under load. Verified empirically
  # 2026-04-28: 10 consecutive runner-start failures, model never loaded.
  # Two workers oversubscribing one slot on .69 still fine — Ollama queues
  # the second request internally.
  max_workers: 6
  # Weight per backend host (substring match against ollama_urls). Repeats
  # the URL in the assignment pool, so weight=2 gets twice as many sticky
  # workers as weight=1. With max_workers=6 and 2:1, we land at 4 workers
  # on .77 (2 slots × 2 oversub) and 2 on .69 (1 slot × 2 oversub). The
  # 2 oversub per slot smooths over individual call latency variance.
  ollama_weights:
    "localhost": 2
    "192.168.1.69": 1
  max_tokens: 80     # 3-field JSON ≈ 50 tokens (sub_model + trim_level +
                     # mileage_in_description_km); 80 leaves slack and caps
                     # "model looping" failures within <1 s wall time.
  max_chars: 2500    # Tail of long ads is usually contact boilerplate, not
                     # features — safe to truncate.
  # System(~280) + description(≤750 @ ~3.3 chars/token pt-PT) + reply(≤80)
  # ≈ 1110 tokens. 2048 leaves ~900 tokens of margin and cuts prefill
  # compute ~33 % vs the previous 3072. The 2026-04 prompt slim shrank the
  # system block from 1582 → ~280 tokens, so the previous 3072 floor is no
  # longer needed.
  num_ctx: 2048

openrouter:
  # Cloud LLM enrichment for the TOP DEALS only (value-gated). The local
  # Ollama pool was retired 2026-07-24; this recovers condition NLP on the
  # handful of genuinely-undervalued listings the GBM flags each day, via a
  # FREE OpenRouter model. The API key is NOT stored here — it lives in the
  # GitHub Actions secret OPENROUTER_API_KEY, injected as env into the
  # "Value-gated OpenRouter enrichment" step. src/parser/openrouter_enrichment
  # reads os.environ["OPENROUTER_API_KEY"]; a missing key makes the step a
  # warn-and-skip no-op (same convention as TELEGRAM_BOT_TOKEN / CF hook).
  base_url: "https://openrouter.ai/api/v1"
  # Free models only, tried in order as a fallback chain. Free models are
  # frequently upstream-rate-limited (HTTP 429) → on 429 we advance to the
  # next model. Shortlist validated 2026-07-24: gemma-4-26b-a4b returns clean
  # JSON in ~8 s; gemma-4-31b 429s often; gpt-oss-20b is the last resort.
  models:
    - "google/gemma-4-26b-a4b-it:free"
    - "google/gemma-4-31b-it:free"
    - "openai/gpt-oss-20b:free"
  temperature: 0.1
  max_tokens: 500     # richer schema (base 3 fields + condition NLP + red_flags)
  max_chars: 2500
  timeout_seconds: 90
  max_retries: 1      # per model, on 429 / 5xx before advancing the chain
  referer: "https://olx-car-parser.permikov134.workers.dev"
  title: "olx-car-parser"
  # Free-tier daily ceiling is ~50 requests/day; stay under it. Budget is in
  # REQUESTS (each POST counts, incl. 429-triggered fallback attempts), tracked
  # per-UTC-day in the state file (auto-resets at midnight). Each listing is
  # normally 1 request. per_run_request_cap spreads spend across the day's
  # scheduled runs (5 shallow + 1 deep).
  daily_request_budget: 40
  per_run_request_cap: 12
  budget_state_file: "data/openrouter_budget.json"
  # Pre-LLM value gate — reproduces the non-LLM half of the deal funnel so we
  # only pay for genuinely-undervalued listings. Applied on top of
  # compute_signals (which already enforces band ≤ 0.40, net ≥ €500, 0<disc≤60%).
  gate:
    min_price_eur: 4000     # skip the condition-blind cheap tail (< €4k)
    min_spec_fill: 0.5      # need ≥2 of 4 discriminative specs
    max_band_pct: 0.40      # (informational; compute_signals already gates this)
    min_discount_pct: 0.0   # undervaluation_pct is a percent (GBM discount)
    max_discount_pct: 60.0

alerts:
  # Bot token is NOT stored here — it lives in the GitHub Actions secret
  # TELEGRAM_BOT_TOKEN, injected as env into the "Send Telegram alerts" step.
  # telegram_bot.py reads env first, this key second (_load_config). Kept
  # empty so a revoked token can't linger in git history. For local runs,
  # `export TELEGRAM_BOT_TOKEN=...` in your shell.
  telegram_bot_token: ""
  telegram_chat_id: "604665081"
  min_discount_pct: 15
  state_file: "data/alerts_state.json"

logging:
  level: "INFO"
  file: "data/parser.log"
