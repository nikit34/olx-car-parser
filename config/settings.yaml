# OLX.pt Car Parser Settings

scraper:
  base_url: "https://www.olx.pt/carros-motos-e-barcos/carros/"
  interval_hours: 6
  request_delay_min: 0.7
  request_delay_max: 1.5
  # 200 covers OLX's full active inventory with margin (typical depth ≈
  # 150 pages). The actual loop terminates earlier via the known-ids
  # early-stop in scrape_all when the deep pages become mostly revisits —
  # ~30 pages on a steady-state DB.
  max_pages: 200
  private_only: true
  # Detail-page fetch concurrency. 16 is a conservative bump from 12 — the
  # log showed only 2 EAGAIN events per 4h, so headroom exists. Higher
  # values (20+) start hitting OLX's per-IP soft rate limit and trigger
  # the 403 backoff in scraper.py:140. Bumping further only pays off
  # paired with a residential-proxy rotation, which we don't have.
  concurrency: 16

database:
  path: "data/olx_cars.db"

analytics:
  trend_window_days: 30
  buy_signal_threshold: 10

llm:
  # Cloud LLM enrichment. The local Ollama pool is GONE (retired 2026-07-24,
  # removed from both hosts 2026-08-23) — there is no self-hosted inference
  # here any more and nothing should try to reach :11434.
  #
  # Providers are a CASCADE, tried in this order: the first one that returns
  # usable JSON wins, and any refusal (missing key, 429, 5xx, unparseable
  # output, spent daily budget) advances to the next. Gemini leads because its
  # free tier is an order of magnitude bigger than OpenRouter's ~50 req/day;
  # OpenRouter is the backstop for when Gemini 503s or the daily quota is out.
  providers:
    - "gemini"
    - "openrouter"
  # Shared generation knobs — both providers use the same prompt and schema,
  # so these live here rather than per-provider.
  temperature: 0.1
  max_tokens: 500    # base 3 fields + condition NLP + red_flags
  max_chars: 2500    # tail of a long ad is contact boilerplate, not features
  # One state file for every provider's spend, keyed per UTC day and per
  # provider name (auto-resets at midnight).
  budget_state_file: "data/llm_budget.json"
  # Requests one scrape run may spend across ALL providers. The daily ceiling
  # is per-provider (below); this spreads spend over the day's runs.
  per_run_request_cap: 20
  # Pre-LLM value gate — reproduces the non-LLM half of the deal funnel so we
  # only pay for genuinely-undervalued listings. Applied on top of
  # compute_signals (which already enforces band ≤ 0.40, net ≥ €500,
  # 0 < disc ≤ 60%). Provider-independent, hence here and not under a provider.
  gate:
    min_price_eur: 4000     # skip the condition-blind cheap tail (< €4k)
    min_spec_fill: 0.5      # need ≥2 of 4 discriminative specs
    max_band_pct: 0.40      # (informational; compute_signals already gates this)
    min_discount_pct: 0.0   # undervaluation_pct is a percent (GBM discount)
    max_discount_pct: 60.0

gemini:
  # Google AI Studio free tier. Key is NOT stored here — it lives in the
  # GitHub Actions secret GEMINI_API_KEY, injected as env into the enrichment
  # step. A missing key makes the provider a warn-and-skip no-op, so the
  # cascade simply moves on to OpenRouter.
  base_url: "https://generativelanguage.googleapis.com/v1beta"
  # Tried in order within the provider, before the cascade moves on.
  models:
    - "gemini-flash-latest"
    - "gemini-flash-lite-latest"
  timeout_seconds: 60
  # Retry inside the provider: free-tier Gemini answers 503 "model overloaded"
  # in bursts (three consecutive 503s observed while validating this prompt on
  # 2026-08-23), and the next attempt usually lands. A 429 is different — see
  # the rate-limit handling in cloud_enrichment.
  max_attempts: 2
  retry_backoff_seconds: 3
  # Client-side pacing, so we discover "no slot" in ~2 s instead of burning a
  # quota unit on a guaranteed 429.
  max_rpm: 4
  slot_wait_seconds: 2
  # MEASURED, not guessed. The free tier allows ~20 generate-content requests
  # per day PER MODEL ("GenerateRequestsPerDayPerProjectPerModel-FreeTier,
  # limit: 20", read straight off a 429 on 2026-08-23), and each model has its
  # own bucket — flash was exhausted while flash-lite still served. With two
  # models in the chain that is ~40/day; 34 leaves headroom for the requests
  # spent outside the scrape (manual runs, smoke checks).
  daily_request_budget: 34


gemini_vision:
  # Photo veto on the surfaced deals. Same key as the text cascade
  # (GEMINI_API_KEY), deliberately a DIFFERENT model: the free-tier quota is
  # per model (~20/day, read off a 429 body on 2026-08-23), so pointing the
  # vision channel at flash-lite while the text cascade leads with flash means
  # they draw on separate buckets instead of starving each other.
  base_url: "https://generativelanguage.googleapis.com/v1beta"
  models:
    - "gemini-flash-lite-latest"
    - "gemini-flash-latest"
  timeout_seconds: 90
  max_attempts: 2
  retry_backoff_seconds: 3
  max_rpm: 4
  # Wait for a pacing slot rather than skipping the deal. A batch pass has
  # nowhere else to go, so 4/min just means it takes a few minutes; at the
  # interactive default of 2 s a 24-deal pass abandoned 17 of them.
  slot_wait_seconds: 70
  # The measured per-model free-tier ceiling. With ~26 deals surfacing a
  # day, the top 20 by decision score get checked and the tail does not —
  # which is the right way round: the veto matters most where people look.
  daily_request_budget: 20
  # One request carries this many photos side by side — the exact format the
  # 30-listing accuracy check was run on.
  max_photos: 3
  sheet_height: 460
  # Veto at "needs repair" and above only. Severity 1 is wear for age, and
  # vetoing on that is the mistake the ResNet veto was making.
  veto_min_severity: 2

openrouter:
  # Cascade backstop, used when Gemini has no key / no slot / no quota, or
  # returns nothing usable. Free tier is ~50 requests/day, an order of
  # magnitude tighter than Gemini's, which is why it sits second.
  # The API key is NOT stored here — GitHub Actions secret OPENROUTER_API_KEY,
  # injected as env into the enrichment step. A missing key makes this
  # provider a no-op and the cascade ends (same convention as
  # TELEGRAM_BOT_TOKEN / CF hook).
  base_url: "https://openrouter.ai/api/v1"
  # Free models only, tried in order WITHIN this provider before the cascade
  # gives up on it. The free pool churns — models get rate-limited, delisted,
  # or quietly moved to paid — so this list is re-verified whenever it's
  # touched rather than trusted. Checked 2026-08-23 against the real
  # extraction prompt: the first two return clean JSON; both gemmas were
  # 429-ing that day (kept as tail candidates since they recover); the old
  # gpt-oss-20b entry was DROPPED because it now 404s with "unavailable for
  # free — the paid version is available".
  models:
    - "dots-studio/dots-3-note-preview:free"
    - "nvidia/nemotron-3-nano-30b-a3b:free"
    - "google/gemma-4-26b-a4b-it:free"
    - "google/gemma-4-31b-it:free"
  timeout_seconds: 90
  max_attempts: 1     # 1 = no same-model retry; a free-model 429 is upstream
                      # congestion, so advance the model chain instead of
                      # burning budget retrying the same (stuck) model.
  retry_backoff_seconds: 1.0  # brief pause before the next model on 429/5xx
  referer: "https://olx-car-parser.permikov134.workers.dev"
  title: "olx-car-parser"
  # Budget is in REQUESTS (each POST counts, incl. 429-triggered fallback
  # attempts), tracked per-UTC-day in llm.budget_state_file.
  daily_request_budget: 40

alerts:
  # Bot token is NOT stored here — it lives in the GitHub Actions secret
  # TELEGRAM_BOT_TOKEN, injected as env into the "Send Telegram alerts" step.
  # telegram_bot.py reads env first, this key second (_load_config). Kept
  # empty so a revoked token can't linger in git history. For local runs,
  # `export TELEGRAM_BOT_TOKEN=...` in your shell.
  telegram_bot_token: ""
  telegram_chat_id: "604665081"
  min_discount_pct: 15
  state_file: "data/alerts_state.json"

logging:
  level: "INFO"
  file: "data/parser.log"
